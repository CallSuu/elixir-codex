spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/elixir_codex
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
openai.api.key=${OPENAI_API_KEY:}
stability.api.key=${STABILITY_API_KEY:}
jwt.secret=${JWT_SECRET}
elixir.art.generation-enabled=true
supplement.ocr.confidence-threshold=70
supplement.affiliate-products=제휴브랜드A,제휴브랜드B
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
